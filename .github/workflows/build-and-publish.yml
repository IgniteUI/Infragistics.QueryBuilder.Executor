name: Build and Publish

on:
  release:
    types: [created]
  
env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '9.x'
  VERSION: ${{ github.ref_name }}

jobs:
  build-sign-publish:
    runs-on: windows-latest
    environment: nuget-org-publish
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build Infragistics.QueryBuilder.Executor.csproj -c ${{ env.BUILD_CONFIGURATION }} /p:Version=${{ env.VERSION }}

      - name: Install Sign CLI
        run: dotnet tool install --tool-path ./sign --prerelease sign

      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          ./sign/sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path "${{ github.workspace }}\bin\${{ env.BUILD_CONFIGURATION }}" -Filter "*.dll" -Recurse
          $failed = @()
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += $dll.FullName
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Unsigned DLLs found:`n$($failed -join "`n")"
            exit 1
          }
          Write-Host "All DLLs signed successfully."

      - name: Pack NuGet package
        run: dotnet pack ./Infragistics.QueryBuilder.Executor.csproj --no-build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} -p:PackageVersion=${{ env.VERSION }} -o "${{ github.workspace }}/nupkg"

      - name: Sign NuGet package
        shell: pwsh
        run: >
          ./sign/sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/nupkg"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/nupkg/Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Generated NuGet Package 
          path: ${{ github.workspace }}/nupkg
          retention-days: 1

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/nupkg/Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
