name: Build and Publish

on:
  release:
    types: [published]

permissions: {}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '9.x'
  VERSION: ${{ github.ref_name }}

jobs:
  # Holds the strong-name key, but no OIDC token, no Key Vault access and no publishing rights.
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.checksums.outputs.manifest-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore strong-name key
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.IG_STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY_BASE64)) {
            throw "The IG_STRONG_NAME_KEY organization secret is empty or unavailable to this repository."
          }

          $keyBytes = [Convert]::FromBase64String($env:STRONG_NAME_KEY_BASE64)
          [System.IO.File]::WriteAllBytes("${{ runner.temp }}\IG.StrongName.snk", $keyBytes)

      - name: Build strong-named assemblies
        shell: pwsh
        run: |
          dotnet build Infragistics.QueryBuilder.Executor.csproj `
            -c ${{ env.BUILD_CONFIGURATION }} `
            /p:Version=${{ env.VERSION }} `
            /p:SignAssembly=true `
            /p:AssemblyOriginatorKeyFile="${{ runner.temp }}\IG.StrongName.snk"

      - name: Delete strong-name key
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\IG.StrongName.snk" -Force -ErrorAction SilentlyContinue

      # obj/ travels with bin/ so the later pack job can run --no-build --no-restore.
      - name: Record build output checksums
        id: checksums
        shell: pwsh
        run: .github/scripts/artifact-checksums.ps1 -Mode Write -ManifestPath build-output.sha256 -Path bin, obj

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            bin/**
            obj/**
            build-output.sha256
          # obj/ contains dot-prefixed generated sources, which are otherwise dropped as hidden files.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  sign-assemblies:
    name: Sign assemblies
    needs: build
    runs-on: windows-latest
    # The environment is what makes the OIDC subject claim match the Entra federated credential.
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest-sha256: ${{ steps.checksums.outputs.manifest-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .

      - name: Verify build output
        shell: pwsh
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Verify -ManifestPath build-output.sha256 -Path bin, obj
          -ExpectedManifestHash ${{ needs.build.outputs.manifest-sha256 }}

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLLs
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "**/*.dll"
          --base-directory "${{ github.workspace }}/bin/${{ env.BUILD_CONFIGURATION }}"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --verbosity Warning

      - name: Validate DLL signatures
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path "${{ github.workspace }}\bin\${{ env.BUILD_CONFIGURATION }}" -Filter "*.dll" -Recurse
          $failed = @()
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid') {
              $failed += $dll.FullName
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Unsigned DLLs found:`n$($failed -join "`n")"
            exit 1
          }
          Write-Host "All DLLs signed successfully."

      - name: Record signed assembly checksums
        id: checksums
        shell: pwsh
        run: .github/scripts/artifact-checksums.ps1 -Mode Write -ManifestPath signed-assemblies.sha256 -Path bin, obj

      - name: Upload signed assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assemblies
          path: |
            bin/**
            obj/**
            signed-assemblies.sha256
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack and sign package
    needs: sign-assemblies
    runs-on: windows-latest
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assemblies
          path: .

      - name: Verify signed assemblies
        shell: pwsh
        run: >
          .github/scripts/artifact-checksums.ps1 -Mode Verify -ManifestPath signed-assemblies.sha256 -Path bin, obj
          -ExpectedManifestHash ${{ needs.sign-assemblies.outputs.manifest-sha256 }}

      - name: Pack NuGet package
        run: dotnet pack ./Infragistics.QueryBuilder.Executor.csproj --no-build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} -p:PackageVersion=${{ env.VERSION }} -o "${{ github.workspace }}/nupkg"

      - name: Validate packaged assembly strong names
        shell: pwsh
        run: |
          $packagePath = "${{ github.workspace }}\nupkg\Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"
          $validationRoot = "${{ runner.temp }}\strong-name-validation"
          $archivePath = "$validationRoot\package.zip"
          $extractPath = "$validationRoot\package"

          try {
            if (-not (Test-Path $packagePath)) {
              throw "NuGet package not found: $packagePath"
            }

            New-Item -ItemType Directory -Path $validationRoot -Force | Out-Null
            Copy-Item $packagePath $archivePath
            Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

            $assemblies = @(Get-ChildItem -Path $extractPath -Filter "*.dll" -Recurse)
            if ($assemblies.Count -eq 0) {
              throw "No assemblies were found in the NuGet package."
            }

            $windowsSdkRoot = Join-Path ${env:ProgramFiles(x86)} "Microsoft SDKs\Windows"
            $strongNameTool = Get-ChildItem -Path $windowsSdkRoot -Filter "sn.exe" -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $strongNameTool) {
              throw "Could not find sn.exe in the Windows SDK."
            }

            foreach ($assembly in $assemblies) {
              & $strongNameTool.FullName -vf $assembly.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Strong-name verification failed: $($assembly.FullName)"
              }
            }

            Write-Host "Verified $($assemblies.Count) strong-name signed package assemblies."
          }
          finally {
            Remove-Item $validationRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/nupkg"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/nupkg/Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg" --verbosity quiet

      # This digest is the identity every downstream job re-checks before acting on the package.
      - name: Record package digest
        id: digest
        shell: pwsh
        run: |
          $name = "Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"
          $package = "${{ github.workspace }}\nupkg\$name"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

          @("### Signed package digest", '```', "$digest  $name", '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-signed
          path: nupkg/*
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: Generate SBOM and attest
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested-sha256: ${{ steps.verify.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: nupkg

      - name: Verify signed package digest
        id: verify
        shell: pwsh
        run: |
          $package = "${{ github.workspace }}\nupkg\Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "${{ needs.pack.outputs.nupkg-sha256 }}"

          if ($digest -ne $expected) {
            throw "Package digest changed between jobs. Expected $expected but found $digest."
          }

          "nupkg-sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Verified package digest $digest."

      # obj/project.assets.json is what component detection reads for the transitive NuGet graph.
      - name: Restore project dependencies
        run: dotnet restore Infragistics.QueryBuilder.Executor.csproj

      # Dedicated nested manifest keeps sbom-tool out of the root 'dotnet tool restore'.
      - name: Restore sbom-tool (pinned)
        run: dotnet tool restore --tool-manifest .config/sbom-tool/dotnet-tools.json

      # sbom-tool fails unless the -m directory already exists.
      - name: Create SBOM output directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\sbom\spdx-2.2", "${{ github.workspace }}\sbom\spdx-3.0" | Out-Null

      # -b is the signed package folder, so the shipped nupkg and its hash land in the SBOM's files section.
      # -bc scans the repository for the dependency graph; -li/-pm resolve license and supplier metadata.
      - name: Generate SBOM (SPDX 2.2)
        working-directory: .config/sbom-tool
        run: >
          dotnet tool run sbom-tool -- generate
          -b ${{ github.workspace }}/nupkg
          -bc ${{ github.workspace }}
          -m ${{ github.workspace }}/sbom/spdx-2.2
          -pn Infragistics.QueryBuilder.Executor
          -pv ${{ env.VERSION }}
          -ps "Infragistics Inc."
          -nsb http://spdx.org/spdxdocs/Infragistics.QueryBuilder.Executor
          -mi SPDX:2.2
          -li true
          -lto 60
          -pm true
          -V Information

      - name: Generate SBOM (SPDX 3.0)
        working-directory: .config/sbom-tool
        run: >
          dotnet tool run sbom-tool -- generate
          -b ${{ github.workspace }}/nupkg
          -bc ${{ github.workspace }}
          -m ${{ github.workspace }}/sbom/spdx-3.0
          -pn Infragistics.QueryBuilder.Executor
          -pv ${{ env.VERSION }}
          -ps "Infragistics Inc."
          -nsb http://spdx.org/spdxdocs/Infragistics.QueryBuilder.Executor
          -mi SPDX:3.0
          -li true
          -lto 60
          -pm true
          -V Information

      - name: Verify SBOM output
        shell: pwsh
        run: |
          $name = "Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"
          $spdx22 = "${{ github.workspace }}\sbom\spdx-2.2\_manifest\spdx_2.2\manifest.spdx.json"
          $spdx30 = "${{ github.workspace }}\sbom\spdx-3.0\_manifest\spdx_3.0\manifest.spdx.json"

          foreach ($document in @($spdx22, $spdx30)) {
            if (-not (Test-Path -LiteralPath $document) -or (Get-Item -LiteralPath $document).Length -eq 0) {
              throw "SBOM document missing or empty: $document"
            }
          }

          $spdx = Get-Content -LiteralPath $spdx22 -Raw | ConvertFrom-Json
          if (-not ($spdx.files | Where-Object { $_.fileName -like "*$name" })) {
            throw "The SPDX 2.2 document does not reference $name."
          }

          Write-Host "SBOM covers $($spdx.packages.Count) packages and $($spdx.files.Count) files."

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: nupkg/*.nupkg

      # actions/attest derives the predicate from an SPDX 2.x or CycloneDX document; SPDX 3.0 ships as evidence only.
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: nupkg/*.nupkg
          sbom-path: sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json

      - name: Collect attestation bundles
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\sbom\attestations"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "${{ steps.attest-provenance.outputs.bundle-path }}" (Join-Path $target 'provenance.sigstore.json')
          Copy-Item "${{ steps.attest-sbom.outputs.bundle-path }}" (Join-Path $target 'sbom.sigstore.json')

          @(
            "### Attestations",
            "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}",
            "- SBOM: ${{ steps.attest-sbom.outputs.attestation-url }}"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SBOM and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/**
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  publish:
    name: Publish to NuGet.org
    needs: [pack, sbom]
    runs-on: windows-latest
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: nupkg

      - name: Verify the package that was packed, signed, and attested
        shell: pwsh
        run: |
          $package = "${{ github.workspace }}\nupkg\Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg"
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()

          foreach ($expected in @("${{ needs.pack.outputs.nupkg-sha256 }}", "${{ needs.sbom.outputs.attested-sha256 }}")) {
            if ($digest -ne $expected) {
              throw "Refusing to publish: expected digest $expected but found $digest."
            }
          }

          Write-Host "Publishing package with digest $digest."

      - name: Validate NuGet package signature
        run: dotnet nuget verify "${{ github.workspace }}/nupkg/Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg" --verbosity quiet

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/nupkg/Infragistics.QueryBuilder.Executor.${{ env.VERSION }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"

      - name: Record published digest
        shell: pwsh
        run: |
          @(
            "### Published to NuGet.org",
            '`${{ needs.pack.outputs.nupkg-sha256 }}`',
            "",
            "NuGet.org repository-signs every uploaded package, so the digest it serves differs from the one above.",
            "Verify attestations against the .nupkg attached to this release."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  attach-to-release:
    name: Attach release evidence
    needs: [pack, sbom, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-signed
          path: nupkg

      - name: Download SBOM and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE_ID: Infragistics.QueryBuilder.Executor
        run: |
          set -euo pipefail

          (cd sbom/spdx-2.2/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-2.2.zip" .)
          (cd sbom/spdx-3.0/_manifest && zip -r "${GITHUB_WORKSPACE}/${PACKAGE_ID}.${TAG}.spdx-3.0.zip" .)

          gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
            "nupkg/${PACKAGE_ID}.${TAG}.nupkg" \
            "nupkg/${PACKAGE_ID}.${TAG}.nupkg.sha256" \
            "${PACKAGE_ID}.${TAG}.spdx-2.2.zip" \
            "${PACKAGE_ID}.${TAG}.spdx-3.0.zip" \
            "sbom/attestations/provenance.sigstore.json" \
            "sbom/attestations/sbom.sigstore.json"
