name: Generate SBOM

# Dry run for the SBOM that build-and-publish.yml produces at release time, so flag changes can be
# reviewed on a PR. The package packed here is unsigned, so nothing is attested or published:
# provenance and SBOM attestations must bind to the signed package digest.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '9.x'
  PACKAGE_VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}

jobs:
  sbom:
    if: github.event.label.name == 'generate sbom'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack NuGet package
        run: >
          dotnet pack Infragistics.QueryBuilder.Executor.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          -p:Version=${{ env.PACKAGE_VERSION }}
          -o ./artifacts

      # Dedicated nested manifest keeps sbom-tool out of the root 'dotnet tool restore' used by build-and-publish.yml
      - name: Restore sbom-tool (pinned)
        run: dotnet tool restore --tool-manifest .config/sbom-tool/dotnet-tools.json

      # -b: the packed nupkg gets listed with its hash in the SBOM's files section
      # -bc: dependency detection scans the repo root (csproj)
      # -li/-pm: resolve license and supplier metadata for the detected packages
      - name: Generate SBOM (SPDX 2.2)
        working-directory: .config/sbom-tool
        run: >
          dotnet tool run sbom-tool -- generate
          -b ${{ github.workspace }}/artifacts
          -bc ${{ github.workspace }}
          -m ${{ github.workspace }}/sbom/spdx-2.2
          -pn Infragistics.QueryBuilder.Executor
          -pv ${{ env.PACKAGE_VERSION }}
          -ps "Infragistics Inc."
          -nsb http://spdx.org/spdxdocs/Infragistics.QueryBuilder.Executor
          -mi SPDX:2.2
          -li true
          -lto 60
          -pm true
          -V Information

      - name: Generate SBOM (SPDX 3.0)
        working-directory: .config/sbom-tool
        run: >
          dotnet tool run sbom-tool -- generate
          -b ${{ github.workspace }}/artifacts
          -bc ${{ github.workspace }}
          -m ${{ github.workspace }}/sbom/spdx-3.0
          -pn Infragistics.QueryBuilder.Executor
          -pv ${{ env.PACKAGE_VERSION }}
          -ps "Infragistics Inc."
          -nsb http://spdx.org/spdxdocs/Infragistics.QueryBuilder.Executor
          -mi SPDX:3.0
          -li true
          -lto 60
          -pm true
          -V Information

      - name: Verify SBOM
        run: |
          set -euo pipefail
          test -s sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json
          test -s sbom/spdx-2.2/_manifest/spdx_2.2/manifest.spdx.json.sha256
          test -s sbom/spdx-3.0/_manifest/spdx_3.0/manifest.spdx.json
          test -s sbom/spdx-3.0/_manifest/spdx_3.0/manifest.spdx.json.sha256
          echo "SBOM generated successfully."

      - name: Upload SBOM files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/**
          retention-days: 1
          if-no-files-found: error
