name: Generate SBOM

# Dry run for the SBOM that build-and-publish.yml produces at release time, so flag changes can be
# reviewed on a PR. It runs the same scripts the release does. The package packed here is unsigned,
# so nothing is attested or published: provenance and SBOM attestations must bind to the signed
# package digest.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '9.x'
  PACKAGE_ID: Infragistics.QueryBuilder.Executor
  PROJECT_PATH: Infragistics.QueryBuilder.Executor.csproj
  PACKAGE_VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}
  SBOM_LICENSE_TIMEOUT_SECONDS: '180'

jobs:
  sbom:
    if: github.event.label.name == 'generate sbom'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          -p:Version=${{ env.PACKAGE_VERSION }}
          -o "${{ github.workspace }}/artifacts"

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Generate SBOMs
        shell: pwsh
        run: >
          .github/scripts/New-Sbom.ps1
          -PackageId "${{ env.PACKAGE_ID }}"
          -PackageVersion "${{ env.PACKAGE_VERSION }}"
          -BuildDropPath "${{ github.workspace }}/artifacts"
          -BuildComponentPath "${{ github.workspace }}"
          -OutputRoot "${{ runner.temp }}/sbom"
          -LicenseTimeoutSeconds ${{ env.SBOM_LICENSE_TIMEOUT_SECONDS }}

      - name: Verify SBOM output
        shell: pwsh
        run: >
          .github/scripts/Assert-Sbom.ps1
          -OutputRoot "${{ runner.temp }}/sbom"
          -ExpectedPackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:PACKAGE_VERSION}.nupkg"

      - name: Generate CycloneDX SBOM
        shell: pwsh
        env:
          GH_TOKEN_FOR_LICENSES: ${{ github.token }}
        run: >
          .github/scripts/New-CycloneDxSbom.ps1
          -ProjectPath "${{ env.PROJECT_PATH }}"
          -PackageId "${{ env.PACKAGE_ID }}"
          -PackageVersion "${{ env.PACKAGE_VERSION }}"
          -OutputDirectory "${{ runner.temp }}/sbom/cyclonedx"
          -GitHubBearerToken "$env:GH_TOKEN_FOR_LICENSES"

      - name: Upload SBOM files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/**
          retention-days: 1
          if-no-files-found: error
